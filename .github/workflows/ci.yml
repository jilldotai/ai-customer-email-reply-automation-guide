name: ci
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install deps
        run: |
          npm ci || npm install
      - name: Generate Prisma client
        run: npx prisma generate || true
      - name: Type check / build
        run: |
          npm run build || npx tsc -p .
      - name: Lint
        run: |
          npm run lint || echo "Lint step skipped (no config yet)"

          