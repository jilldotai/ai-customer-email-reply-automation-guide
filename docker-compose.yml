version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: app
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 5s
      timeout: 5s
      retries: 10